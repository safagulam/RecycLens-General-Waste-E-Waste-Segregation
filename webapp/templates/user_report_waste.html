<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Waste - Smart Waste Classifier</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --primary-green: #1b4332; /* Deep Forest Green */
            --mid-green: #2d6a4f;
            --accent-green: #95d5b2;
            --pure-white: #ffffff;
            --off-white: #f4f9f4;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: var(--pure-white);
            color: var(--primary-green);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* --- Bubble Animation --- */
        #bubble-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            border: 1px solid var(--accent-green);
            border-radius: 50%;
            opacity: 0.3;
            animation: floatUp 15s infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            display: grid;
            grid-template-columns: 350px 1fr;
            border: 2px solid var(--primary-green);
            box-shadow: 30px 30px 0px var(--accent-green);
            position: relative;
            z-index: 10;
        }

        .sidebar {
            background: var(--primary-green);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar h1 {
            font-size: 3rem;
            line-height: 1;
            font-weight: 400;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .sidebar p {
            font-style: italic;
            font-size: 1.2rem;
            opacity: 0.8;
            border-bottom: 1px solid var(--accent-green);
            padding-bottom: 20px;
        }

        .content { padding: 60px; background: white; }

        .form-section {
            margin-bottom: 50px;
            position: relative;
        }

        .section-title {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--primary-green);
            display: inline-block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .form-group { margin-bottom: 25px; }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-bottom: 1px solid #ccc;
            background: var(--off-white);
            font-family: "Times New Roman", serif;
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-bottom: 2px solid var(--primary-green);
            background: white;
        }

        #map {
            height: 450px;
            width: 100%;
            margin: 20px 0;
            border: 1px solid var(--primary-green);
            filter: grayscale(1);
            transition: 0.5s;
        }
        
        #map:hover { filter: grayscale(0); }

        .btn {
            padding: 15px 40px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition);
            font-family: "Times New Roman", serif;
        }

        .btn-primary {
            background: var(--primary-green);
            color: white;
            width: 100%;
            margin-top: 30px;
        }

        .btn-primary:hover {
            background: var(--mid-green);
            letter-spacing: 4px;
        }

        .btn-secondary {
            background: var(--off-white);
            color: var(--primary-green);
            border: 1px solid var(--primary-green);
            margin-bottom: 20px;
        }

        .alert {
            padding: 20px;
            margin-bottom: 20px;
            font-style: italic;
            border: 1px solid;
            display: none;
        }

        .alert-success { background: #f0fff4; color: #276749; border-color: #9ae6b4; }
        .alert-error { background: #fff5f5; color: #c53030; border-color: #feb2b2; }

        .location-info {
            background: var(--off-white);
            padding: 20px;
            border-left: 4px solid var(--primary-green);
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .sidebar { padding: 40px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="bubble-canvas"></div>

    <div class="container">
        <div class="sidebar">
            <div>
                <h1>Logistics <br>Report</h1>
                <p>Strategic waste coordination and community purification.</p>
            </div>
            <div style="font-size: 0.8rem; opacity: 0.6; text-transform: uppercase;">
                Smart Waste Classifier <br> © 2026 Registry
            </div>
        </div>

        <div class="content">
            <div id="alertContainer"></div>

            <form id="reportForm" onsubmit="handleSubmitReport(event)">
                <!-- Personal Information -->
                <div class="form-section">
                    <h3 class="section-title">01 Personnel</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="userName" required placeholder="Identity">
                        </div>
                        <div class="form-group">
                            <label>Phone Number *</label>
                            <input type="tel" id="phone" required placeholder="+91">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email Address *</label>
                        <input type="email" id="email" required placeholder="name@domain.com">
                    </div>
                </div>

                <!-- Location Information -->
                <div class="form-section">
                    <h3 class="section-title">02 Coordinates</h3>
                    
                    <div class="form-group">
                        <label>Deployment Address *</label>
                        <textarea id="address" rows="2" required placeholder="Street, Area, City"></textarea>
                    </div>

                    <button type="button" class="btn btn-secondary" onclick="getCurrentLocation()">
                        📍 Use Live Coordinates
                    </button>

                    <div id="map"></div>

                    <div class="location-info" id="locationInfo" style="display: none;">
                        <h4 style="text-transform: uppercase; font-size: 0.8rem; margin-bottom: 5px;">Verification Status:</h4>
                        <p>LAT: <span id="displayLat">-</span> | LNG: <span id="displayLng">-</span></p>
                    </div>

                    <input type="hidden" id="latitude">
                    <input type="hidden" id="longitude">
                </div>

                <!-- Waste Information -->
                <div class="form-section">
                    <h3 class="section-title">03 Material Data</h3>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Material Stream *</label>
                            <select id="wasteType" required>
                                <option value="">-- Classification --</option>
                                <option value="E-Waste">E-Waste (Silicon/Metal)</option>
                                <option value="Bio-Waste">Bio-Waste (Organic)</option>
                                <option value="Mixed">Mixed Stream</option>
                                <option value="Plastic">Synthetic/Plastic</option>
                                <option value="Metal">Ferrous/Metal</option>
                                <option value="Hazardous">Hazardous Content</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Est. Mass (kg) *</label>
                            <input type="number" step="0.1" id="wasteWeight" required placeholder="0.00">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Observation Notes</label>
                        <textarea id="wasteDescription" rows="2" placeholder="Specific item details..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Visual Evidence</label>
                        <input type="file" id="wasteImage" accept="image/*" style="border: none; padding: 0; background: none;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    Execute Submission
                </button>
            </form>
        </div>
    </div>

    <script>
        // --- BUBBLE GENERATOR ---
        const canvas = document.getElementById('bubble-canvas');
        for (let i = 0; i < 20; i++) {
            const b = document.createElement('div');
            b.className = 'bubble';
            const size = Math.random() * 50 + 10 + 'px';
            b.style.width = size; b.style.height = size;
            b.style.left = Math.random() * 100 + 'vw';
            b.style.animationDuration = Math.random() * 10 + 10 + 's';
            b.style.animationDelay = Math.random() * 5 + 's';
            canvas.appendChild(b);
        }

        // --- MAP LOGIC (UNTOUCHED) ---
        let map, marker;
        let selectedLat = null;
        let selectedLng = null;

        window.addEventListener('load', function() {
            const defaultLat = 20.5937;
            const defaultLng = 78.9629;
            map = L.map('map').setView([defaultLat, defaultLng], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            map.on('click', function(e) {
                selectLocation(e.latlng.lat, e.latlng.lng);
            });
        });

        function getCurrentLocation() {
            if (navigator.geolocation) {
                showAlert('📍 Synchronizing...', 'success');
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        selectLocation(position.coords.latitude, position.coords.longitude);
                    },
                    function() { showAlert('❌ Signal failed.', 'error'); }
                );
            }
        }

        function selectLocation(lat, lng) {
            selectedLat = lat; selectedLng = lng;
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
            document.getElementById('displayLat').textContent = lat.toFixed(6);
            document.getElementById('displayLng').textContent = lng.toFixed(6);
            document.getElementById('locationInfo').style.display = 'block';
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
            map.setView([lat, lng], 15);
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                .then(r => r.json())
                .then(d => { if (d.display_name) document.getElementById('address').value = d.display_name; });
        }

        // --- SUBMISSION LOGIC (UNTOUCHED) ---
        async function handleSubmitReport(event) {
            event.preventDefault();
            if (!selectedLat || !selectedLng) {
                showAlert('❌ Map coordinates required.', 'error');
                return;
            }
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            const formData = {
                user_id: 1, 
                user_name: document.getElementById('userName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                latitude: selectedLat,
                longitude: selectedLng,
                waste_type: document.getElementById('wasteType').value,
                waste_weight: parseFloat(document.getElementById('wasteWeight').value),
                waste_description: document.getElementById('wasteDescription').value || null
            };

            try {
                const response = await fetch('/api/waste-reports/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();
                if (result.success) {
                    showAlert('✅ Report Logged. Redirecting...', 'success');
                    setTimeout(() => { window.location.href = '/user-dashboard'; }, 3000);
                } else {
                    showAlert('❌ Error: ' + result.message, 'error');
                }
            } catch (error) {
                showAlert('❌ Server connection failed.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Execute Submission';
            }
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const div = document.createElement('div');
            div.className = `alert alert-${type}`;
            div.textContent = message;
            container.appendChild(div);
            div.style.display = 'block';
            setTimeout(() => { div.remove(); }, 5000);
        }
    </script>
</body>
</html>
